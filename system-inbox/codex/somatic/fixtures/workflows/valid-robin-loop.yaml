schema_version: 1
id: valid-robin-loop
title: Valid Robin Loop Fixture
mode: robin-loop
description: Offline fixture for a Crow, Falcon, sandbox EvidenceSource, Finch, and StructuredVerdict loop.
version: 0.3.0
status: fixture
stages:
  - id: crow-literature
    kind: literature-search
    requires: []
    provider_refs:
      - literature
    inputs:
      - research_goal
    outputs:
      - literature_brief
  - id: falcon-plan
    kind: planning
    requires:
      - crow-literature
    provider_refs:
      - planner
    inputs:
      - literature_brief
    outputs:
      - experiment_plan
    safety_gate: plan-boundary-review
  - id: sandbox-acquire
    kind: simulation
    requires:
      - falcon-plan
    provider_refs:
      - sandbox
    inputs:
      - experiment_plan
    outputs:
      - raw_evidence
  - id: finch-analysis
    kind: analysis
    requires:
      - sandbox-acquire
    provider_refs:
      - analysis
    inputs:
      - literature_brief
      - experiment_plan
      - observation_results
    outputs:
      - analysis_report
      - structured_verdict
inputs:
  - id: research_goal
    kind: text
    required: true
    sensitivity: public
    description: Research goal for the loop.
  - id: observation_results
    kind: file
    required: false
    sensitivity: internal
    description: Optional local observation fixture.
providers:
  - ref: literature
    class: literature
    capabilities:
      - corpus.search
      - evidence.extract
    required: true
  - ref: planner
    class: llm
    capabilities:
      - plan.research
      - critique.generate
    required: true
  - ref: analysis
    class: llm
    capabilities:
      - result.analyze
      - hypothesis.update
    required: true
  - ref: sandbox
    class: sensor
    capabilities:
      - sandbox.evidence.acquire
    required: true
    constraints:
      offline_required: true
      mock_only: true
artifacts:
  - id: literature_brief
    kind: evidence-table
    format: json
    retention: run
    hash_required: true
  - id: experiment_plan
    kind: plan
    format: json
    retention: run
    hash_required: true
  - id: analysis_report
    kind: report-packet
    format: json
    retention: user-export
    hash_required: true
  - id: raw_evidence
    kind: evidence-table
    format: json
    retention: run
    hash_required: true
  - id: structured_verdict
    kind: report-packet
    format: json
    retention: user-export
    hash_required: true
  - id: robin_loop_summary
    kind: report-packet
    format: json
    retention: run
    hash_required: true
safety_profile:
  risk_class: moderate
  domain: lab-research
  human_review_required: true
  external_actions_allowed: false
  real_lab_action_requires_approval: true
  clinical_safety_gate_required: false
  code_pack_quarantine_required: false
  notes:
    - Research planning and sandbox evidence only; no automatic lab action.
    - Mock offline Robin-shaped loop only.
evidence_requirements:
  min_records: 2
  sandbox_modalities:
    - literature
    - sim
    - wetlab
  accepted_source_types:
    - paper
    - dataset
    - lab-result
    - user-note
  citation_required: true
  provenance_required: true
  hash_required: true
  limitations_required: true
  counterevidence_required: true
output_packet:
  kind: report-packet
  schema_ref: docs/report-packet.md
  required_sections:
    - summary
    - evidence_table
    - hypotheses
    - counterevidence
    - methods
    - safety_review
    - structured_verdict
  review_state: human-review-required
