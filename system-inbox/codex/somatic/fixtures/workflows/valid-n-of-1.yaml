safety_profile:
  risk_class: low
  domain: sensor-research
  human_review_required: true
  external_actions_allowed: false
  real_lab_action_requires_approval: false
  clinical_safety_gate_required: false
  code_pack_quarantine_required: false
  notes:
    - Fake-backed sensor planning only.
    - No hardware, CSI, camera, audio, wearable, BLE, WiFi, thermal, or environmental capture.
    - No WiFi CSI packet capture, monitor mode, WiFi device probing, ESP32, RTL8812AU, router, adapter, or driver access.
    - Raw RF/CSI data is local-first and private by default; this fixture collects, retains, and exports none.
    - Personal profile and baseline graph are fake-backed local placeholders only.
    - No real health data is loaded and no real profile storage is performed.
    - No database, external memory, Hindsight, Mem0, or Zep runtime is used.
    - Fake-backed intervention tags are mock intervention metadata only.
    - No advice, no medical advice, no recommendation, no prescription, no treatment recommendation, no medication action, no clinician action, and no effectiveness claim.
    - Medication placeholder disabled and clinician review placeholder disabled categories are disabled metadata only.
    - Response evaluation is future planning only; no real monitoring, no reminders, automation, or scheduling.
    - Phase 7E response evaluation is fake-backed local research-only planning only.
    - Follow-up comparison uses fixture trend labels only; no intervention effectiveness is claimed.
    - No effectiveness claim and no action/advice/prescription/treatment is recommended.
    - The consolidated n-of-1 report packet is fake-backed/local/research-only, not a medical record, and not a health record.
    - Report packet hashes are for reproducibility/provenance only.
    - The n-of-1 Fabric pack plan is planning-only and private-only by default.
    - No Fabric signing, catalog publication, transport, magnet, WebSeed, seeding, upload, install, or execution is enabled.
    - No real personal data export, no personal health data export, no raw sensor data export, and no raw RF/CSI data export.
    - The neutral environment evidence pack is fixture-only sanitized row/count/status metadata, not raw row export and not ranking input.
    - Future real Fabric packaging requires explicit consent, redaction, license review, privacy review, safety review, human review, local-first storage controls, retention/export controls, and separate publication approval.
    - No reminders, automation, notification, or scheduling.
    - No diagnosis, treatment, emergency triage, real monitoring, or clinical claim.
    - No emergency triage is performed.
    - Future real sensor mode requires explicit consent, local-first privacy policy, and safety review.
    - Future real baseline storage requires explicit local storage consent, data-locality review, privacy review, safety review, human review, retention/export controls, and separate opt-in configuration.
    - Future real intervention tag use requires explicit consent, human/clinical review, local storage controls, safety gates, and no emergency-triage substitution.
evidence_requirements:
  min_records: 1
  accepted_source_types:
    - sensor-planning-placeholder
  citation_required: false
  provenance_required: true
  hash_required: true
  limitations_required: true
  counterevidence_required: false
output_packet:
  kind: report-packet
  schema_ref: docs/report-packet.md
  required_sections:
    - workflow
    - sensor_plan
    - baseline_placeholder
    - personal_baseline_planning
    - baseline_comparison
    - intervention_tagging
    - response_evaluation_plan
    - response_evaluation_summary
    - n_of_1_report_packet
    - n_of_1_fabric_pack_plan
    - artifact_count_hash_summary
    - loop_stage_summary
    - strict_boundary_summary
    - privacy_boundary
    - limitations
    - safety_review
    - future_real_mode_requirements
  review_state: human-review-required
