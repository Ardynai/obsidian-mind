<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#0d241b"/><stop offset="55%" stop-color="#08150F"/><stop offset="100%" stop-color="#06110C"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#12A574"/><stop offset="1" stop-color="#35E7A6"/></linearGradient>
    <linearGradient id="pnl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12261E"/><stop offset="1" stop-color="#0a1812"/></linearGradient>
  </defs>
  <rect width="1100" height="600" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 40H1100M0 80H1100M0 120H1100M0 160H1100M0 200H1100M0 240H1100M0 280H1100M0 320H1100M0 360H1100M0 400H1100M0 440H1100M0 480H1100M0 520H1100M0 560H1100"/>
    <path d="M40 0V600M120 0V600M200 0V600M280 0V600M360 0V600M440 0V600M520 0V600M600 0V600M680 0V600M760 0V600M840 0V600M920 0V600M1000 0V600M1080 0V600"/>
  </g>

  <text x="48" y="52" fill="#35E7A6" font-family="'IBM Plex Mono',monospace" font-size="13" letter-spacing="4">FIGURE 2 — DATA FLOW &amp; SAFETY GATES</text>
  <text x="48" y="86" fill="#EAF5EF" font-size="30" font-weight="700" font-family="'Space Grotesk','IBM Plex Sans',sans-serif">Every request runs the same gates</text>
  <text x="48" y="112" fill="#93AC9F" font-size="15">Consent, emergency screen, framing, citation-binding and biosecurity are on the path — not optional add-ons.</text>

  <!-- main pipeline connectors -->
  <g stroke="url(#pipe)" stroke-width="4">
    <line x1="212" y1="232" x2="248" y2="232"/>
    <line x1="432" y1="232" x2="468" y2="232"/>
    <line x1="652" y1="232" x2="688" y2="232"/>
    <line x1="872" y1="232" x2="908" y2="232"/>
  </g>
  <g fill="#35E7A6">
    <polygon points="250,232 236,225 236,239"/><polygon points="470,232 456,225 456,239"/>
    <polygon points="690,232 676,225 676,239"/><polygon points="910,232 896,225 896,239"/>
  </g>

  <!-- stage 1 request -->
  <g>
    <rect x="48" y="188" width="164" height="88" rx="14" fill="url(#pnl2)" stroke="#4CC4F5" stroke-opacity="0.5"/>
    <text x="130" y="228" fill="#EAF5EF" font-size="16" font-weight="700" text-anchor="middle" font-family="'Space Grotesk',sans-serif">UI action</text>
    <text x="130" y="252" fill="#93AC9F" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Mono',monospace">request</text>
  </g>
  <!-- stage 2 consent -->
  <g>
    <rect x="250" y="182" width="182" height="100" rx="14" fill="url(#pnl2)" stroke="#35E7A6" stroke-opacity="0.6"/>
    <rect x="250" y="182" width="182" height="100" rx="14" fill="none" stroke="#35E7A6" stroke-opacity="0.14" stroke-width="6"/>
    <text x="341" y="222" fill="#8DF6C9" font-size="15.5" font-weight="700" text-anchor="middle" font-family="'IBM Plex Mono',monospace">require_consent</text>
    <text x="341" y="248" fill="#93AC9F" font-size="12.5" text-anchor="middle">scope default-OFF</text>
  </g>
  <!-- stage 3 emergency -->
  <g>
    <rect x="470" y="182" width="182" height="100" rx="14" fill="url(#pnl2)" stroke="#35E7A6" stroke-opacity="0.6"/>
    <rect x="470" y="182" width="182" height="100" rx="14" fill="none" stroke="#35E7A6" stroke-opacity="0.14" stroke-width="6"/>
    <text x="561" y="222" fill="#8DF6C9" font-size="15.5" font-weight="700" text-anchor="middle" font-family="'IBM Plex Mono',monospace">emergency_screen</text>
    <text x="561" y="248" fill="#93AC9F" font-size="12.5" text-anchor="middle">on input &amp; output</text>
  </g>
  <!-- stage 4 engine + output gates -->
  <g>
    <rect x="690" y="176" width="182" height="112" rx="14" fill="url(#pnl2)" stroke="#F5B84A" stroke-opacity="0.5"/>
    <text x="781" y="212" fill="#EAF5EF" font-size="15.5" font-weight="700" text-anchor="middle" font-family="'Space Grotesk',sans-serif">engine + framing</text>
    <text x="781" y="236" fill="#93AC9F" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono',monospace">frame_advisory ·</text>
    <text x="781" y="254" fill="#93AC9F" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono',monospace">citation-bind · biosec</text>
  </g>
  <!-- stage 5 response -->
  <g>
    <rect x="910" y="188" width="164" height="88" rx="14" fill="url(#pnl2)" stroke="#35E7A6" stroke-opacity="0.6"/>
    <rect x="910" y="188" width="164" height="88" rx="14" fill="none" stroke="#35E7A6" stroke-opacity="0.14" stroke-width="6"/>
    <text x="992" y="222" fill="#35E7A6" font-size="16" font-weight="700" text-anchor="middle" font-family="'Space Grotesk',sans-serif">Response</text>
    <text x="992" y="252" fill="#93AC9F" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono',monospace">framed · features only</text>
  </g>

  <!-- branch: consent off -> blocked -->
  <g stroke="#93AC9F" stroke-width="2" stroke-dasharray="4 4"><line x1="341" y1="282" x2="341" y2="360"/></g>
  <rect x="250" y="360" width="182" height="58" rx="10" fill="#0a1812" stroke="#93AC9F" stroke-opacity="0.4"/>
  <text x="341" y="386" fill="#CFE8DD" font-size="12.5" text-anchor="middle" font-family="'IBM Plex Mono',monospace">403 · blocked</text>
  <text x="341" y="404" fill="#93AC9F" font-size="11.5" text-anchor="middle">until you grant it</text>

  <!-- branch: emergency -> clinician (CORAL, only red) -->
  <g stroke="#FB7185" stroke-width="2" stroke-dasharray="4 4"><line x1="561" y1="282" x2="561" y2="360"/></g>
  <rect x="470" y="360" width="182" height="58" rx="10" fill="#1c0f12" stroke="#FB7185" stroke-opacity="0.55"/>
  <text x="561" y="385" fill="#FB7185" font-size="12.5" text-anchor="middle" font-weight="700">see a clinician now</text>
  <text x="561" y="404" fill="#f2b6bf" font-size="11.5" text-anchor="middle">red flag short-circuits</text>

  <!-- branch: no citation -> honest null -->
  <g stroke="#93AC9F" stroke-width="2" stroke-dasharray="4 4"><line x1="781" y1="288" x2="781" y2="360"/></g>
  <rect x="690" y="360" width="182" height="58" rx="10" fill="#0a1812" stroke="#35E7A6" stroke-opacity="0.4"/>
  <text x="781" y="385" fill="#8DF6C9" font-size="12.5" text-anchor="middle">honest-null</text>
  <text x="781" y="404" fill="#93AC9F" font-size="11.5" text-anchor="middle">no source → consult a pro</text>

  <!-- bottom rail -->
  <rect x="48" y="470" width="1026" height="82" rx="12" fill="#0a1812" stroke="#35E7A6" stroke-opacity="0.22"/>
  <circle cx="78" cy="500" r="6" fill="#4CC4F5"/>
  <text x="98" y="505" fill="#CFE8DD" font-size="14" font-family="'IBM Plex Mono',monospace">Sensors: raw frames / audio / CSI IQ are dropped in-process — only derived features reach the response.</text>
  <circle cx="78" cy="530" r="6" fill="#35E7A6"/>
  <text x="98" y="535" fill="#CFE8DD" font-size="14" font-family="'IBM Plex Mono',monospace">No diagnosis / prescription / dosing wording ever passes framing. Coral is used for emergency routing and nothing else.</text>
</svg>
